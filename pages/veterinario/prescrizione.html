<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescrizione · Veterinari.it</title>
    <!-- Assicurati che il percorso del CSS sia corretto per il tuo progetto -->
    <link rel="stylesheet" href="../../css/prescrizione.css">
</head>
<body>

    <!-- Toolbar: Freccia indietro + Tasto Stampa -->
    <div class="page-toolbar">
        <div class="toolbar-group">
            <button id="btnBack" class="toolbar-back" aria-label="Indietro">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button id="btnPrint" class="btn-print">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                Stampa
            </button>
        </div>
    </div>

    <!-- Contenitore dinamico del foglio -->
    <div class="sheet-wrapper" id="sheetContainer">
        <!-- Il JS inietterà qui la ricetta -->
    </div>

    <script type="module" src="../../js/prescrizione.js"></script>
</body>
</html>
