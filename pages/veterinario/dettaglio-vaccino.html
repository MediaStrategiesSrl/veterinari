<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Vaccino · Veterinari.it</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/dettaglio-vaccino.css">
</head>
<body>
<div class="page">
    <header class="page-header">
        <button class="icon-btn" id="btnIndietro" aria-label="Indietro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <div class="page-header__titles">
            <h1>Dettaglio Vaccino</h1>
            <p id="animaleSubtitle">Caricamento...</p>
        </div>
        <div style="width: 44px;"></div> <!-- Spaziatore per centrare il titolo -->
    </header>

    <main>
        <!-- Info Vaccino -->
        <div class="vaccino-card" id="infoVaccino">
            <div class="skeleton">Caricamento dati...</div>
        </div>

        <!-- Sezione Bollino -->
        <div class="bollino-section">
            <div class="bollino-header">
                <h2>Bollino Vaccinale</h2>
                <p>Fotografa il lotto e la scadenza del vaccino</p>
            </div>

            <!-- Preview Immagine (nascosta di default) -->
            <div id="bollinoPreviewContainer" class="bollino-preview" hidden>
                <img id="bollinoImage" src="" alt="Bollino Vaccino">
                <button class="btn-secondario" id="btnSostituisci">Sostituisci bollino</button>
            </div>

            <!-- Area Upload (visibile di default) -->
            <label id="bollinoUploadContainer" class="bollino-upload">
                <input type="file" id="inputBollino" accept="image/*" hidden>
                <div class="upload-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>Tocca per scattare o caricare la foto del bollino</span>
                </div>
            </label>

            <!-- Status Message -->
            <div id="uploadStatus" class="status-message" hidden></div>
        </div>
    </main>
</div>

<script type="module" src="../../js/dettaglio-vaccino.js"></script>
</body>
</html>
