<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disponibilità e Turni — Professionista</title>
    
    <!-- Fogli di stile -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/disponibilita.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-container">

    <!-- Header -->
    <header class="top-nav">
        <a href="javascript:history.back()" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="page-title">
            <h1>Disponibilità</h1>
            <span>Orari e luoghi di appuntamento</span>
        </div>
        <div style="width: 24px;"></div>
    </header>

  <main class="main-content">
    
    <!-- Hero Card (Azzurra) -->
    <div class="blue-header-card">
        <h2>Gestione Turni</h2>
        <p>Imposta i tuoi orari di lavoro per consentire ai clienti di prenotare i tuoi servizi nei momenti giusti.</p>
    </div>

    <!-- Selettore Struttura/Zona (AGGIUNTO ID: locationCardContainer e display: none) -->
    <div id="locationCardContainer" class="location-card" style="display: none;">
        <div class="location-selector">
            <label for="locationSelect" style="font-weight: 700; color: #1E293B; margin-bottom: 12px; display: block; font-size: 0.95rem;">
                Seleziona la sede / zona operativa
            </label>
            <div class="select-wrapper">
                <i class="fa-solid fa-location-dot select-icon"></i>
                <select id="locationSelect" class="custom-select form-control">
                    <option value="" disabled selected>Caricamento sedi...</option>
                </select>
                <i class="fa-solid fa-chevron-down dropdown-icon"></i>
            </div>
        </div>
    </div>

    <!-- Area dei turni -->
    <div id="turniContainer" style="display: none; margin-top: 15px;">
        <!-- Renderizzato via JS -->
    </div>

</main>
    <!-- Bottom Bar con Bottone Salva -->
    <div class="floating-bottom-bar">
        <button id="btnSaveSchedule" class="btn-primary" disabled>
            <i class="fa-solid fa-floppy-disk"></i> Salva disponibilità
        </button>
    </div>

    <!-- Punta al JS specifico del professionista. Defer garantisce che il DOM sia pronto -->
    <script type="module" src="../../js/disponibilita-pro.js" defer></script>
</body>
</html>
