<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Aggiorna Password — Veterinari.it</title>
</head>
<body>

    <main class="login-card">
        <div class="logo-container">
            <img src="img/Logo-Veterinari-wp1-1-1024x190.webp" alt="Logo Veterinari.it" class="app-logo">
        </div>
        
        <p class="subtitle">Scegli una nuova password sicura per il tuo account.</p>

        <h2 class="section-title">NUOVA PASSWORD</h2>

        <form id="updatePasswordForm" action="#" method="post">
            <div class="form-group">
                <label for="newPassword">Nuova Password</label>
                <input type="password" id="newPassword" name="newPassword" required minlength="8" placeholder="Almeno 8 caratteri">
            </div>

            <button type="submit" id="submitButton">Salva Nuova Password <i class="fa-solid fa-floppy-disk" style="margin-left: 5px;"></i></button>
        </form>

        <p id="statusMessage" class="status-message" role="status" hidden></p>
    </main>

    <script type="module" src="js/aggiorna-password.js"></script>
</body>
</html>
