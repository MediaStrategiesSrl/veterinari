<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Recupera Password — Veterinari.it</title>
</head>
<body>

    <main class="login-card">
        <div class="logo-container">
            <img src="img/Logo-Veterinari-wp1-1-1024x190.webp" alt="Logo Veterinari.it" class="app-logo">
        </div>
        
        <p class="subtitle">Inserisci l'email associata al tuo account per ricevere un link di ripristino.</p>

        <h2 class="section-title">RECUPERA PASSWORD</h2>

        <form id="recoveryForm" action="#" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="Inserisci la tua email">
            </div>

            <button type="submit" id="submitButton">Invia Link di Recupero <i class="fa-solid fa-envelope" style="margin-left: 5px;"></i></button>
        </form>

        <p id="statusMessage" class="status-message" role="status" hidden></p>

        <p class="signup-link" style="margin-top: 25px;"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Torna al Login</a></p>
    </main>

    <script type="module" src="js/recupero-password.js"></script>
</body>
</html>
